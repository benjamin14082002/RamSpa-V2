{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | RAM SPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'ramspa-red': '#C72100' } } } }
    </script>
    <style>
        input { border: 1px solid #d1d5db; border-radius: 0.5rem; padding: 0.75rem 1rem; margin-top: 0.25rem; width: 100%; outline: none; }
        input:focus { border-color: #C72100; }
        label { font-size: 0.875rem; font-weight: 600; color: #374151; }
        .helptext { font-size: 0.75rem; color: #6b7280; display: block; margin-top: 0.25rem; margin-bottom: 1rem; }
        ul.errorlist { color: #dc2626; font-size: 0.875rem; margin-bottom: 0.5rem; list-style-type: none; padding-left: 0; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 md:p-10 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Crear Cuenta</h2>
            <p class="text-gray-500 mt-2">Únete a RAM SPA para cotizar proyectos</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-ramspa-red text-white font-bold py-3 rounded-lg hover:bg-orange-700 transition mt-6">Registrarse</button>
        </form>
        <p class="text-center text-sm text-gray-600 mt-6">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-ramspa-red font-bold hover:underline">Inicia Sesión</a></p>
        <div class="text-center mt-4">
            <a href="{% url 'inicio' %}" class="text-gray-400 hover:text-gray-600 text-sm font-medium transition">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
